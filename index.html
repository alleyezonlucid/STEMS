<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STEMS — California Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080809;--surf:#0d0d10;--brd:#18181f;--brd2:#22222c;
  --txt:#6a6d7e;--txt2:#3a3d4e;--hi:#4a72f5;--hi2:#6088ff;
}
html,body{height:100%;background:var(--bg);}
body{
  font-family:'Barlow Condensed',sans-serif;color:var(--txt);
  display:flex;flex-direction:column;min-height:100vh;
  background-image:radial-gradient(rgba(255,255,255,0.014) 1px,transparent 1px);
  background-size:20px 20px;
}
/* HEADER */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;border-bottom:1px solid var(--brd);flex-shrink:0;
}
.brand{font-size:9px;font-weight:700;letter-spacing:.35em;color:var(--brd2);text-transform:uppercase;user-select:none;}
.title{font-size:14px;font-weight:600;letter-spacing:.14em;color:#c8ccd8;text-transform:uppercase;}
.led-row{display:flex;align-items:center;gap:6px;font-size:8px;font-weight:600;letter-spacing:.2em;color:var(--brd2);min-width:70px;justify-content:flex-end;}
.led{width:5px;height:5px;border-radius:50%;flex-shrink:0;transition:background .3s,box-shadow .3s;}
.led.loading{background:#f5a623;box-shadow:0 0 6px #f5a62380;animation:blink .7s ease-in-out infinite;}
.led.ready  {background:#22c55e;box-shadow:0 0 6px #22c55e80;animation:blink 2.4s ease-in-out infinite;}
.led.error  {background:#ef4444;box-shadow:0 0 6px #ef444480;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
/* LOADING */
.overlay{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.load-label{font-size:9px;font-weight:600;letter-spacing:.2em;color:var(--txt2);text-transform:uppercase;}
.load-bar-wrap{width:220px;height:2px;background:var(--brd2);border-radius:1px;overflow:hidden;}
.load-bar{height:100%;background:linear-gradient(90deg,#2244bb,var(--hi2));border-radius:1px;transition:width .3s;}
.load-dots{display:flex;gap:8px;}
.load-dot{width:6px;height:6px;border-radius:50%;opacity:.2;transition:opacity .3s,box-shadow .3s;}
.load-dot.done{opacity:1;}
/* MIXER */
.mixer{
  flex:1;display:flex;justify-content:center;gap:2px;
  padding:24px 20px 14px;overflow-x:auto;min-height:0;
}
.ch{
  flex:1;min-width:82px;max-width:130px;
  background:var(--surf);border:1px solid var(--brd);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;padding-bottom:10px;
  transition:border-color .18s,box-shadow .18s,opacity .18s;overflow:hidden;
}
.ch:hover {border-color:var(--brd2);}
.ch.soloed{box-shadow:inset 0 0 0 1px rgba(255,180,0,.15);}
.ch.muted {opacity:.45;}
.ch-bar{width:100%;height:2px;flex-shrink:0;border-radius:4px 4px 0 0;}
.ch-name{
  font-size:9px;font-weight:700;letter-spacing:.18em;text-align:center;
  margin:10px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88%;
}
canvas.vu{margin:4px 0 6px;display:block;flex-shrink:0;}
.ms{display:flex;gap:4px;margin:4px 0;}
.btn{
  width:28px;height:18px;border:1px solid var(--brd2);background:transparent;
  color:var(--txt2);font-family:'Barlow Condensed',sans-serif;
  font-size:9px;font-weight:700;letter-spacing:.04em;border-radius:2px;
  cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;
}
.btn:hover {color:var(--txt);border-color:#3a3d4e;}
.btn.m-on  {background:rgba(220,40,40,.18);color:#ff5050;border-color:rgba(220,40,40,.4);}
.btn.s-on  {background:rgba(240,160,0,.14);color:#f5a623;border-color:rgba(240,160,0,.35);}
.fader-wrap{flex:1;min-height:88px;display:flex;align-items:center;justify-content:center;overflow:visible;}
.fader{
  width:108px;transform:rotate(-90deg);
  -webkit-appearance:none;appearance:none;
  background:transparent;cursor:pointer;outline:none;margin:0;padding:0;display:block;
}
.fader::-webkit-slider-runnable-track{height:3px;background:var(--brd2);border-radius:1.5px;}
.fader::-webkit-slider-thumb{
  -webkit-appearance:none;width:30px;height:13px;margin-top:-5px;
  background:linear-gradient(to bottom,#252930,#1b1d24);
  border:1px solid #3a3d4e;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 5px rgba(0,0,0,.55);
}
.fader::-webkit-slider-thumb:hover{background:linear-gradient(to bottom,#2e3240,#22252e);}
.fader::-moz-range-track{height:3px;background:var(--brd2);border-radius:1.5px;}
.fader::-moz-range-thumb{
  width:30px;height:13px;background:#252930;border:1px solid #3a3d4e;
  border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.55);cursor:pointer;
}
.vol-num{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--txt2);margin-top:4px;letter-spacing:.04em;}
/* TRANSPORT */
.transport{
  border-top:1px solid var(--brd);padding:14px 28px 20px;
  display:flex;flex-direction:column;gap:10px;flex-shrink:0;background:var(--surf);
}
.timeline{display:flex;align-items:center;gap:10px;}
.time{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--txt2);min-width:36px;flex-shrink:0;}
.time.r{text-align:right;}
.prog{flex:1;height:3px;background:var(--brd2);border-radius:1.5px;cursor:pointer;position:relative;overflow:visible;}
.prog-fill{height:100%;background:linear-gradient(90deg,#2244bb,var(--hi2));border-radius:1.5px;pointer-events:none;position:relative;}
.prog-fill::after{
  content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;background:var(--hi2);border-radius:50%;box-shadow:0 0 10px rgba(96,136,255,.55);
}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;}
.ctrl{
  height:30px;padding:0 12px;border:1px solid var(--brd2);background:transparent;
  color:var(--txt2);font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:.06em;
  border-radius:3px;cursor:pointer;transition:all .13s;text-transform:uppercase;white-space:nowrap;
}
.ctrl:hover   {color:var(--txt);border-color:#3a3d4e;}
.ctrl:disabled{opacity:.3;cursor:not-allowed;}
.play-btn{
  width:46px;height:46px;border-radius:50%;
  border:1.5px solid #1e3a99;background:rgba(30,58,153,.1);
  color:#4060cc;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .18s;
}
.play-btn:hover  {background:rgba(30,58,153,.22);border-color:#2a50bb;color:var(--hi2);transform:scale(1.06);}
.play-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.play-btn.on{background:rgba(30,58,153,.2);box-shadow:0 0 22px rgba(96,136,255,.2);}
@media(max-width:540px){
  .mixer{padding:12px 6px 8px;gap:1px;}
  .ch   {min-width:58px;}
  .transport{padding:10px 14px 14px;}
  .hdr  {padding:12px 14px;}
  .ctrl {padding:0 8px;font-size:9px;}
}
</style>
</head>
<body>

<header class="hdr">
  <span class="brand">STEMS</span>
  <span class="title">CALIFORNIA RIDE</span>
  <div class="led-row">
    <span class="led loading" id="led"></span>
    <span id="led-label">0%</span>
  </div>
</header>

<div class="overlay" id="overlay">
  <div class="load-label">Loading stems...</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar" style="width:0%"></div></div>
  <div class="load-dots" id="load-dots"></div>
</div>

<div class="mixer" id="mixer" style="display:none"></div>

<div class="transport">
  <div class="timeline">
    <span class="time" id="cur">0:00</span>
    <div class="prog" id="prog"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="time r" id="tot">0:00</span>
  </div>
  <div class="controls">
    <button class="ctrl" id="btn-rst" disabled>⏮ RST</button>
    <button class="ctrl" id="btn-back" disabled>−15s</button>
    <button class="play-btn" id="btn-play" disabled>▶</button>
    <button class="ctrl" id="btn-fwd" disabled>+15s</button>
    <button class="ctrl" id="btn-end" disabled>END ⏭</button>
  </div>
</div>

<script>
const BASE = "https://raw.githubusercontent.com/alleyezonlucid/STEMS/main";
const STEMS = [
  { id:"acordes", label:"ACORDES", color:"#3db8ff", url:`${BASE}/ACORDES.mp3` },
  { id:"bass",    label:"BASS",    color:"#ff8c21", url:`${BASE}/BASS.mp3`    },
  { id:"drums",   label:"DRUMS",   color:"#ff3d3d", url:`${BASE}/DRUMS.mp3`   },
  { id:"juno",    label:"JUNO",    color:"#b87fff", url:`${BASE}/JUNO.mp3`    },
  { id:"violin",  label:"VIOLIN",  color:"#21d494", url:`${BASE}/VIOLIN.mp3`  },
];

// ── State ──────────────────────────────────────────────────────────────────
const state = STEMS.map(s => ({ vol:0.8, muted:false, solo:false }));
let playing = false, curT = 0, dur = 0, startAt = 0, pauseAt = 0;
let raf = null, vuraf = null;

// ── Audio ──────────────────────────────────────────────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
const ctx = new AC();
const master = ctx.createGain();
master.gain.value = 0.88;
master.connect(ctx.destination);

const channels = STEMS.map(() => {
  const gain = ctx.createGain(); gain.gain.value = 0.8;
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.72;
  gain.connect(analyser); analyser.connect(master);
  return { gain, analyser, buf: null, src: null };
});

// ── Build channel strips ───────────────────────────────────────────────────
const mixer = document.getElementById("mixer");
const canvases = [];
const dotsEl   = document.getElementById("load-dots");

STEMS.forEach((s, i) => {
  // loading dot
  const dot = document.createElement("div");
  dot.className = "load-dot";
  dot.style.background = s.color;
  dot.style.color = s.color;
  dotsEl.appendChild(dot);

  // channel strip
  const ch = document.createElement("div");
  ch.className = "ch";
  ch.id = `ch-${i}`;
  ch.innerHTML = `
    <div class="ch-bar" style="background:${s.color}"></div>
    <div class="ch-name" style="color:${s.color}">${s.label}</div>
    <canvas class="vu" width="22" height="120" id="vu-${i}"></canvas>
    <div class="ms">
      <button class="btn" id="m-${i}">M</button>
      <button class="btn" id="s-${i}">S</button>
    </div>
    <div class="fader-wrap">
      <input type="range" class="fader" id="f-${i}" min="0" max="1" step="0.01" value="0.8" />
    </div>
    <div class="vol-num" id="v-${i}">80</div>
  `;
  mixer.appendChild(ch);
  canvases.push(document.getElementById(`vu-${i}`));

  document.getElementById(`m-${i}`).addEventListener("click", () => toggleMute(i));
  document.getElementById(`s-${i}`).addEventListener("click", () => toggleSolo(i));
  document.getElementById(`f-${i}`).addEventListener("input", e => setVol(i, parseFloat(e.target.value)));
});

// ── VU meters ─────────────────────────────────────────────────────────────
function drawVU(canvas, rms) {
  const c = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  c.clearRect(0,0,W,H);
  const N=22, gap=2, segH=(H-gap*(N-1))/N;
  const active = Math.round((rms/255)*N);
  for (let i=0;i<N;i++) {
    const y = H-(i+1)*(segH+gap)+gap;
    if (i < active) {
      const r=i/N;
      const col = r<.58?"#22c55e":r<.8?"#eab308":"#ef4444";
      c.fillStyle=col; c.shadowBlur=4; c.shadowColor=col;
    } else { c.fillStyle="rgba(255,255,255,0.04)"; c.shadowBlur=0; }
    c.fillRect(0,y,W,segH);
  }
}
function vuLoop() {
  vuraf = requestAnimationFrame(vuLoop);
  channels.forEach((ch,i) => {
    const cv = canvases[i]; if(!cv) return;
    const arr = new Uint8Array(ch.analyser.frequencyBinCount);
    ch.analyser.getByteFrequencyData(arr);
    drawVU(cv, arr.reduce((a,b)=>a+b,0)/arr.length);
  });
}
vuLoop();

// ── Load stems ────────────────────────────────────────────────────────────
(async () => {
  const dots = dotsEl.querySelectorAll(".load-dot");
  let maxDur = 0;
  for (let i=0; i<STEMS.length; i++) {
    try {
      const res = await fetch(STEMS[i].url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await ctx.decodeAudioData(await res.arrayBuffer());
      channels[i].buf = buf;
      if (buf.duration > maxDur) { maxDur = buf.duration; dur = maxDur; }
      dots[i].classList.add("done");
      const pct = Math.round(((i+1)/STEMS.length)*100);
      document.getElementById("load-bar").style.width = pct+"%";
      document.getElementById("led-label").textContent = pct+"%";
    } catch(err) {
      console.error("Stem load failed:", STEMS[i].label, err);
      document.getElementById("led").className = "led error";
      document.getElementById("led-label").textContent = "ERROR";
      return;
    }
  }
  // Ready
  document.getElementById("overlay").style.display = "none";
  document.getElementById("mixer").style.display    = "flex";
  document.getElementById("led").className   = "led ready";
  document.getElementById("led-label").textContent  = "READY";
  document.getElementById("tot").textContent = fmt(dur);
  ["btn-rst","btn-back","btn-play","btn-fwd","btn-end"].forEach(id => {
    document.getElementById(id).disabled = false;
  });
})();

// ── Playback ──────────────────────────────────────────────────────────────
function startSrcs(offset) {
  const now = ctx.currentTime;
  channels.forEach(ch => {
    try { ch.src?.stop(); } catch {}
    if (!ch.buf) return;
    const src = ctx.createBufferSource();
    src.buffer = ch.buf; src.connect(ch.gain);
    src.start(now, Math.max(0, Math.min(offset, ch.buf.duration - 0.001)));
    ch.src = src;
  });
  startAt = now - offset;
}
function startTick() {
  const tick = () => {
    const elapsed = ctx.currentTime - startAt;
    if (elapsed >= dur) { stopPlayback(); updateProgress(0); return; }
    updateProgress(elapsed);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function stopPlayback() {
  playing = false; pauseAt = 0;
  document.getElementById("btn-play").className = "play-btn";
  document.getElementById("btn-play").textContent = "▶";
  cancelAnimationFrame(raf);
}
function updateProgress(t) {
  curT = t;
  document.getElementById("cur").textContent = fmt(t);
  document.getElementById("prog-fill").style.width = (dur>0 ? Math.min(100,(t/dur)*100) : 0)+"%";
}

function play() {
  if (ctx.state === "suspended") ctx.resume();
  startSrcs(pauseAt); playing = true; startTick();
  document.getElementById("btn-play").className = "play-btn on";
  document.getElementById("btn-play").textContent = "⏸";
}
function pause() {
  pauseAt = ctx.currentTime - startAt;
  channels.forEach(ch => { try { ch.src?.stop(); } catch {} });
  cancelAnimationFrame(raf); playing = false;
  document.getElementById("btn-play").className = "play-btn";
  document.getElementById("btn-play").textContent = "▶";
}
function seek(t) {
  const c = Math.max(0, Math.min(dur, t));
  pauseAt = c; updateProgress(c);
  if (playing) {
    cancelAnimationFrame(raf);
    channels.forEach(ch => { try { ch.src?.stop(); } catch {} });
    startSrcs(c); startTick();
  }
}

document.getElementById("btn-play").addEventListener("click", () => playing ? pause() : play());
document.getElementById("btn-rst").addEventListener("click",  () => seek(0));
document.getElementById("btn-back").addEventListener("click", () => seek(Math.max(0, curT-15)));
document.getElementById("btn-fwd").addEventListener("click",  () => seek(Math.min(dur, curT+15)));
document.getElementById("btn-end").addEventListener("click",  () => seek(dur));
document.getElementById("prog").addEventListener("click", e => {
  const r = document.getElementById("prog").getBoundingClientRect();
  seek(((e.clientX - r.left) / r.width) * dur);
});

// ── Gains ─────────────────────────────────────────────────────────────────
function applyGains() {
  const hasSolo = state.some(s => s.solo);
  state.forEach((s, i) => {
    const g = s.muted ? 0 : (hasSolo && !s.solo ? 0 : s.vol);
    channels[i].gain.gain.setTargetAtTime(g, ctx.currentTime, 0.02);
  });
}
function setVol(i, v) {
  state[i].vol = v;
  document.getElementById(`v-${i}`).textContent = Math.round(v*100);
  applyGains();
}
function toggleMute(i) {
  state[i].muted = !state[i].muted;
  const btn = document.getElementById(`m-${i}`);
  btn.className = "btn" + (state[i].muted ? " m-on" : "");
  document.getElementById(`ch-${i}`).className = "ch" +
    (state[i].muted?" muted":"") + (state[i].solo?" soloed":"");
  applyGains();
}
function toggleSolo(i) {
  state[i].solo = !state[i].solo;
  const btn = document.getElementById(`s-${i}`);
  btn.className = "btn" + (state[i].solo ? " s-on" : "");
  document.getElementById(`ch-${i}`).className = "ch" +
    (state[i].muted?" muted":"") + (state[i].solo?" soloed":"");
  applyGains();
}

// ── Utils ─────────────────────────────────────────────────────────────────
function fmt(s) {
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
}
</script>
</body>
</html>
