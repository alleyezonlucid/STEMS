<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>STEMS PRO</title>
<style>
body{margin:0;background:#0a0a0c;color:#aaa;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
button{cursor:pointer}
.track{display:flex;border-bottom:1px solid #222}
.panel{width:120px;padding:10px}
.wf{flex:1;position:relative}
canvas{width:100%;height:80px}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:white}
.transport{padding:10px;border-top:1px solid #222}
</style>
</head>
<body>

<div id="tracks"></div>
<div class="transport">
<button id="play">▶</button>
</div>

<script>
const FILES=[
"ACORDES.mp3","BASS.mp3","DRUMS.mp3"
];

const ctx=new (window.AudioContext||window.webkitAudioContext)();
let buffers=[];
let gains=[];
let sources=[];
let playing=false;
let startTime=0;
let pauseTime=0;

const master=ctx.createGain();
master.gain.value=0.9;

const comp=ctx.createDynamicsCompressor();
comp.threshold.value=-1.5;
comp.ratio.value=10;
comp.knee.value=6;

master.connect(comp);
comp.connect(ctx.destination);

FILES.forEach(()=>{
 const g=ctx.createGain();
 g.connect(master);
 gains.push(g);
});

async function load(){
 for(let f of FILES){
  const res=await fetch(f);
  const buf=await ctx.decodeAudioData(await res.arrayBuffer());
  buffers.push(buf);
 }
 buildUI();
}

function buildUI(){
 const wrap=document.getElementById("tracks");
 buffers.forEach((buf,i)=>{
  const row=document.createElement("div");
  row.className="track";

  const panel=document.createElement("div");
  panel.className="panel";

  const slider=document.createElement("input");
  slider.type="range";
  slider.min=0;slider.max=100;slider.value=100;
  slider.oninput=e=>{
    const v=Math.pow(e.target.value/100,2);
    gains[i].gain.setTargetAtTime(v,ctx.currentTime,0.01);
  };

  panel.appendChild(slider);

  const wf=document.createElement("div");
  wf.className="wf";

  const canvas=document.createElement("canvas");
  wf.appendChild(canvas);

  const ph=document.createElement("div");
  ph.className="playhead";
  wf.appendChild(ph);

  drawWave(canvas,buf);

  wf.onclick=e=>{
    const r=wf.getBoundingClientRect();
    const pct=(e.clientX-r.left)/r.width;
    seek(pct*buf.duration);
  };

  row.appendChild(panel);
  row.appendChild(wf);
  wrap.appendChild(row);
 });
}

function drawWave(canvas,buf){
 const c=canvas.getContext("2d");
 const w=canvas.width=canvas.offsetWidth;
 const h=canvas.height=canvas.offsetHeight;
 const data=buf.getChannelData(0);
 const step=Math.floor(data.length/w);

 for(let x=0;x<w;x++){
  let min=1,max=-1;
  for(let j=0;j<step;j++){
    const v=data[(x*step)+j];
    if(v<min)min=v;
    if(v>max)max=v;
  }
  c.fillRect(x,(1+min)*h/2,1,Math.max(1,(max-min)*h/2));
 }
}

function start(offset=0){
 const t=ctx.currentTime+0.05;
 buffers.forEach((buf,i)=>{
  const src=ctx.createBufferSource();
  src.buffer=buf;
  src.connect(gains[i]);
  src.start(t,offset);
  sources[i]=src;
 });
 startTime=t-offset;
 loop();
}

function stop(){
 sources.forEach(s=>{try{s.stop()}catch{}});
 sources=[];
}

function play(){
 ctx.resume();
 start(pauseTime);
 playing=true;
}

function pause(){
 pauseTime=ctx.currentTime-startTime;
 stop();
 playing=false;
}

function seek(t){
 pauseTime=t;
 if(playing){
  stop();
  start(t);
 }
}

function loop(){
 if(!playing)return;
 const t=ctx.currentTime-startTime;
 document.querySelectorAll(".playhead").forEach(ph=>{
  ph.style.left=(t/buffers[0].duration*100)+"%";
 });
 requestAnimationFrame(loop);
}

document.getElementById("play").onclick=()=>{
 if(!playing)play(); else pause();
};

load();
</script>
</body>
</html>
